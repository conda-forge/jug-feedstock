{% set name = "Jug" %}
{% set version = "2.7.0" %}
{% set sha256 = "af73e7b636194d3db8696d0f7605b709e83968a1897b2865614f02907835e46d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - jug = jug.jug:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - bottle
    - pyyaml

test:
  requires:
    - python {{ python_min }}
  imports:
    - jug
  commands:
    - jug -h

about:
  home: https://github.com/luispedro/jug
  license: MIT
  license_family: MIT
  license_file: COPYING.MIT
  summary: Task based Python workflow system

  description: |
    Jug allows you to write code that is broken up into
    tasks and run different tasks on different processors.
  doc_url: https://jug.readthedocs.io/
  dev_url: https://github.com/luispedro/jug
  identifiers:
    - doi: 10.5334/jors.161

extra:
  recipe-maintainers:
    - luispedro
